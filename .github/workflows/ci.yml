name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
      - run: uv run pytest

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Start server with deterministic providers
        working-directory: server
        env:
          MOCK_PROVIDERS_ENABLED: "true"
          POLISH_ENABLED: "true"
          STT_MAX_ACTIVE_SESSIONS: "20"
          STT_GLOBAL_ACTIVE_SESSIONS: "100"
          STT_ADMISSION_QUEUE_SIZE: "20"
          STT_ADMISSION_WAIT_SECONDS: "5"
          STT_MAX_CONCURRENCY: "3"
          STT_ASR_QUEUE_SIZE: "12"
          STT_ASR_GLOBAL_CONCURRENCY: "20"
          POLISH_LOCAL_CONCURRENCY: "3"
          POLISH_QUEUE_SIZE: "12"
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          uv sync --frozen
          .venv/bin/uvicorn lili_voice_input.main:app --host 127.0.0.1 --port 9100 > /tmp/lili-voice-input.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/lili-voice-input.pid"
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9100/health/ready && exit 0
            sleep 1
          done
          cat /tmp/lili-voice-input.log
          exit 1
      - name: Run 10-user WebSocket smoke load
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}:/work" -w /work
          -e BASE_HTTP=http://127.0.0.1:9100
          -e BASE_WS=ws://127.0.0.1:9100
          -e VUS=10 -e DURATION=1m -e AUDIO_SECONDS=10
          grafana/k6:0.57.0 run load/k6-websocket.js
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-server-load-log
          path: /tmp/lili-voice-input.log
      - name: Stop load-test server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/lili-voice-input.pid" ]; then
            server_pid="$(cat "$RUNNER_TEMP/lili-voice-input.pid")"
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" || true
            fi
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
