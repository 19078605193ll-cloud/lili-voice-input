services:
  voice-input:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

